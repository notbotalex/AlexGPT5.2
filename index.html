<!DOCTYPE html>
<html>
<head>
  <title>AlexGPT</title>

  <script src="https://js.puter.com/v2/"></script>

  <style>
    body {
      margin: 0;
      background: #212121;
      color: white;
      font-family: Arial;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    h1 {
      margin: 0;
      padding: 20px;
      background: #171717;
    }

    #chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .input {
      display: flex;
      padding: 15px;
      background: #171717;
    }

    input {
      flex: 1;
      padding: 15px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    button {
      margin-left: 10px;
      padding: 15px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>
  <img src="logo.jpg" width="45" style="vertical-align: middle;">
  AlexGPT
</h1>

<div id="chat">
  <p><b>AlexGPT:</b> Hi! Ask me anything! 👋</p>
</div>

<div class="input">
  <input id="message" placeholder="Message AlexGPT..." />
  <button onclick="sendMessage()">Send</button>
</div>

<script>
async function const message = input.value.trim(); {
  const input = document.getElementById("message");
  const chat = document.getElementById("chat");
  const message = input.value.trim();

  if (!message) return;

  chat.innerHTML += `<p><b>You:</b> ${message}</p>`;
  input.value = "";

  chat.innerHTML += `<p id="thinking"><b>AlexGPT:</b> Thinking... 🤔</p>`;

  try {
    const response = await puter.ai.chat(message);
    document.getElementById("thinking").innerHTML =
      "<b>AlexGPT:</b> " + response.message.content;
  } catch (error) {
    document.getElementById("thinking").innerHTML =
      "<b>AlexGPT:</b> Sorry, something went wrong.";
  }
}
</script>
