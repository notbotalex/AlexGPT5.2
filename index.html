<script>
let messages = JSON.parse(localStorage.getItem("alexgpt_memory")) || [];

function showMessages() {
  const chat = document.getElementById("chat");
  chat.innerHTML = "";

  messages.forEach(m => {
    chat.innerHTML += `<p><b>${m.role === "user" ? "You" : "AlexGPT"}:</b> ${m.content}</p>`;
  });

  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById("message");
  const chat = document.getElementById("chat");
  const message = input.value.trim();

  if (!message) return;

  messages.push({
    role: "user",
    content: message
  });

  input.value = "";
  showMessages();

  chat.innerHTML += `<p id="thinking"><b>AlexGPT:</b> Thinking... 🤔</p>`;

  try {
    const response = await puter.ai.chat(messages);

    const answer = response.message.content;

    messages.push({
      role: "assistant",
      content: answer
    });

    localStorage.setItem("alexgpt_memory", JSON.stringify(messages));

    showMessages();

  } catch (error) {
    chat.innerHTML += `<p><b>AlexGPT:</b> Sorry, something went wrong.</p>`;
  }
}

showMessages();
</script>
