<!DOCTYPE html>
<html>
<head>
  <title>AlexGPT</title>
  <style>
    body {
      margin: 0;
      background: #212121;
      color: white;
      font-family: Arial;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    h1 {
      padding: 20px;
      margin: 0;
      background: #171717;
    }

    #chat {
      flex: 1;
      padding: 20px;
    }

    .input {
      display: flex;
      padding: 15px;
      background: #171717;
    }

    input {
      flex: 1;
      padding: 15px;
      border-radius: 10px;
      border: none;
    }

    button {
      margin-left: 10px;
      padding: 15px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>🤖 AlexGPT</h1>

  <div id="chat">
    <p>Hi! I'm AlexGPT. 👋</p>
  </div>

  <div class="input">
    <input id="message" placeholder="Message AlexGPT..." />
    <button onclick="send()">Send</button>
  </div>

  <script>
    function send() {
      const box = document.getElementById("message");
      const chat = document.getElementById("chat");

      if (box.value.trim() !== "") {
        chat.innerHTML += "<p>You: " + box.value + "</p>";
        box.value = "";
      }
    }
  </script>
</body>
</html>
